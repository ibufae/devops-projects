name: Build and deploymoodboard app
on:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
    - name: sonarqube
      uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    - name: SonarQube Quality Gate check
      id: sonarqube-quality-gate-check
      uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa
      with:
        pollingTimeoutSec: 600
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    - name: "Show SonarQube Quality Gate Status value"
      run: echo "The Quality Gate status is ${{ steps.sonarqube-quality-gate-check.outputs.quality-gate-status }}"
  test:
    runs-on: ubuntu-latest
    needs: quality
    steps:
    - name: Checkout source code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
    - name: Setup java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
        cache: maven
        cache-dependency-path: moodboard-backend/pom.xml
    - run: java --version
    - name: Run tests
      run: |
        echo "Running the Tests"
        echo "Tests completed successfully."
  build-and-push:
    needs: ['test', 'quality']
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            build_args: ""
          - service: frontend
            build_args: "REACT_APP_API_URL=${{ vars.REACT_APP_API_URL }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Log in to Harbor
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ${{ secrets.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./moodboard-${{ matrix.service }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ secrets.HARBOR_URL }}/moodboard/${{ matrix.service }}:${{ github.sha }}
  deploy-staging:
    needs:  build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.EC2_HOST_STAGING }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: compose.deploy.yml
          target: /opt/moodboard
      - uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.EC2_HOST_STAGING }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/moodboard
            echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ secrets.HARBOR_URL }} -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin
            trap 'docker logout ${{ secrets.HARBOR_URL }}' EXIT
            echo "IMAGE_TAG=${{ github.sha }}" > .env.tag
            echo "HARBOR_URL=${{ secrets.HARBOR_URL }}" >> .env.tag
            docker compose -f compose.deploy.yml --env-file .env --env-file .env.tag pull
            docker compose -f compose.deploy.yml --env-file .env --env-file .env.tag up -d
            docker image prune -a -f --filter "until=168h"
            docker logout ${{ secrets.HARBOR_URL }}
      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@b0fa283ad8fea605de13dc3f449259339835fc52
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: " Deployment  in staingsuccess"
      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@b0fa283ad8fea605de13dc3f449259339835fc52
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: " Deployment in staging failed"
  deploy-prod:
    needs:  build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.EC2_HOST_PROD }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: compose.deploy.yml
          target: /opt/moodboard
      - uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.EC2_HOST_PROD }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/moodboard
            echo "${{ secrets.HARBOR_PASSWORD }}" | docker login ${{ secrets.HARBOR_URL }} -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin
            trap 'docker logout ${{ secrets.HARBOR_URL }}' EXIT
            echo "IMAGE_TAG=${{ github.sha }}" > .env.tag
            echo "HARBOR_URL=${{ secrets.HARBOR_URL }}" >> .env.tag
            docker compose -f compose.deploy.yml --env-file .env --env-file .env.tag pull
            docker compose -f compose.deploy.yml --env-file .env --env-file .env.tag up -d
            docker image prune -a -f --filter "until=168h"
            docker logout ${{ secrets.HARBOR_URL }}
      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@b0fa283ad8fea605de13dc3f449259339835fc52
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: " Deployment in production success"
      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@b0fa283ad8fea605de13dc3f449259339835fc52
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: " Deployment in production failed"
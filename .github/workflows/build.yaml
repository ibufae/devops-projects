name: Build moodboard app
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # Étape 1 : Checkout du code source
    - name: Checkout source code
      uses: actions/checkout@v4
    - name: Setup java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
        cache: maven
    - run: java --version
    # Étape 4 : Run tests
    - name: Run tests
      run: mvn -B test
